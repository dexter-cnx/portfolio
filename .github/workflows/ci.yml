name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare static assets
        run: make prepare

      - name: Check formatting for changed Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- '*.dart')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi
          dart format "${files[@]}"
          if ! git diff --exit-code -- "${files[@]}"; then
            echo "::error::Changed Dart files are not formatted. Run dart format on the files shown above."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/portfolio/"
