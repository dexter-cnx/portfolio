name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare static assets
        run: make prepare

      - name: Apply formatting
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- '*.dart')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed Dart files to format."
            exit 0
          fi
          dart format "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${files[@]}"
            git commit -m "style: dart format Thai localization"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            echo "Formatting committed; strict CI will be restored next."
            exit 0
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/portfolio/"
